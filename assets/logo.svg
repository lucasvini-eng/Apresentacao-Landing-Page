<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Definições de Estilo e Gradientes -->
  <defs>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1D22"/>
      <stop offset="50%" stop-color="#80161A"/>
      <stop offset="100%" stop-color="#600D11"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F5B81C"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <path id="textCircleTop" d="M 45,150 A 105,105 0 0,1 255,150" fill="none" />
    <path id="textCircleBottom" d="M 250,150 A 100,100 0 0,1 50,150" fill="none" />
  </defs>

  <!-- Círculo Base Externo com Borda Dourada -->
  <circle cx="150" cy="150" r="142" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="7" filter="url(#badgeShadow)"/>
  
  <!-- Anéis Dourados Decorativos -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="#F5B81C" stroke-width="2"/>
  <circle cx="150" cy="150" r="102" fill="none" stroke="#F5B81C" stroke-width="2.5"/>

  <!-- Texto Curvo Superior: COLÉGIO MICHELINI -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="21" fill="#FEE440" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      COLÉGIO MICHELINI
    </textPath>
  </text>

  <!-- Sol Nascente / Raios de Fundo -->
  <g opacity="0.4" stroke="#F5B81C" stroke-width="1.5">
    <path d="M 85,125 L 215,125" />
    <path d="M 92,118 L 208,118" />
    <path d="M 100,111 L 200,111" />
    <path d="M 110,104 L 190,104" />
    <path d="M 122,97 L 178,97" />
    <path d="M 136,90 L 164,90" />
    <circle cx="150" cy="130" r="35" fill="none" stroke="#F5B81C" stroke-width="2" />
  </g>

  <!-- Três Figuras / Alunos Vitoriosos de Braços Abertos -->
  <!-- Aluno Central -->
  <circle cx="150" cy="68" r="7" fill="#FEE440"/>
  <path d="M 150,75 L 150,115 M 150,83 L 132,68 M 150,83 L 168,68 M 150,115 L 140,135 M 150,115 L 160,135" stroke="#FEE440" stroke-width="3" stroke-linecap="round"/>

  <!-- Aluno Esquerdo -->
  <circle cx="112" cy="78" r="6" fill="#FEE440"/>
  <path d="M 112,84 L 112,120 M 112,90 L 96,78 M 112,90 L 128,80 M 112,120 L 104,136 M 112,120 L 120,136" stroke="#FEE440" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Aluno Direito -->
  <circle cx="188" cy="78" r="6" fill="#FEE440"/>
  <path d="M 188,84 L 188,120 M 188,90 L 172,80 M 188,90 L 204,78 M 188,120 L 180,136 M 188,120 L 196,136" stroke="#FEE440" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Faixa Central "CM" -->
  <rect x="44" y="136" width="212" height="48" rx="4" fill="url(#wineGrad)" stroke="#F5B81C" stroke-width="3.5"/>
  <text x="150" y="174" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="38" fill="#FEE440" text-anchor="middle" letter-spacing="3">CM</text>

  <!-- Palavra Tradição -->
  <text x="150" y="206" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Tradição</text>

  <!-- Linha Decorativa Inferior -->
  <path d="M 90,213 L 210,213" stroke="#F5B81C" stroke-width="2" stroke-linecap="round"/>

  <!-- Texto Curvo Inferior: QUALIDADE - SERIEDADE -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-weight="800" font-size="14" fill="#FEE440" letter-spacing="2.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      QUALIDADE • SERIEDADE
    </textPath>
  </text>
</svg>
